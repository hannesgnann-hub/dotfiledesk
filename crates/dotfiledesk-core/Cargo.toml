[package]
name = "dotfiledesk-core"
version = "0.1.0"
description = "Platform-agnostic core for DotfileDesk: discovery, tracking, history and security for dotfiles"
authors = ["hannesgnann"]
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
walkdir = "2"
similar = "2"

[dev-dependencies]
tempfile = "3"
