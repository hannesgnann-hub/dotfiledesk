[package]
name = "dotfiledesk"
version = "0.1.0"
description = "DotfileDesk — manage your dotfiles like GitHub Desktop manages your code"
authors = ["hannesgnann"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
dotfiledesk-core = { path = "../../crates/dotfiledesk-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
